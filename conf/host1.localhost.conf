<VirtualHost *:80>
    ServerName host1.localhost
    DocumentRoot /var/www/apps/host1/
    DirectoryIndex index.cfm
    ErrorLog ${APACHE_LOG_DIR}/host1-error.log
    CustomLog ${APACHE_LOG_DIR}/host1-access.log combined

    # WebSocket proxy (LDEV-6223)
    ProxyPass /ws/ ws://localhost:8888/ws/
    ProxyPassReverse /ws/ ws://localhost:8888/ws/
</VirtualHost>